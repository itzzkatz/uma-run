<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Uma Run Sprite Mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE occasion: a bright, cute endless runner
   IDEA the original Uma Run, seen from above as a pixel diorama that turns with every corner
   PICTURE the whole screen is the game: sprite-stacked temple causeway, runner, monkeys, obstacles
   COLOUR biome grounds lead; Uma pink #ff6aa8 for buttons and highlights, white HUD text with dark edge
   TYPE Fredoka 600/700 for everything
   LAYOUT full-screen canvas; HUD top corners, banners centred, menus as one centred card; same on a phone */
:root{color-scheme:dark;--pink:#ff6aa8;--ink:#1d1630}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#0e1a12;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{font:600 16px/1.3 Fredoka,system-ui,sans-serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:max(12px,env(safe-area-inset-top)) 14px 0;pointer-events:none}
.stat{text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 6px rgba(0,0,0,.35)}
.dist{font-size:clamp(28px,6vw,40px);font-weight:700;line-height:1}
.sub{display:flex;gap:12px;align-items:center;margin-top:4px;font-size:18px}
.carrot{display:inline-flex;align-items:center;gap:6px}
.carrot i{display:inline-block;width:12px;height:16px;background:linear-gradient(#52c83a 0 30%,#ff8a1e 30%);clip-path:polygon(15% 0,85% 0,85% 30%,60% 100%,40% 100%,15% 30%);}
.chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{font-size:13px;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.42)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:auto}
.best{font-size:14px;opacity:.9}
.pbtn{width:44px;height:44px;border-radius:12px;border:0;background:rgba(0,0,0,.38);color:#fff;font:700 18px Fredoka,sans-serif;cursor:pointer}
.banner{position:fixed;left:50%;top:24%;transform:translate(-50%,-50%);font-size:clamp(20px,5vw,34px);font-weight:700;text-align:center;white-space:nowrap;padding:8px 18px;border-radius:14px;background:rgba(0,0,0,.35);text-shadow:0 2px 0 rgba(0,0,0,.6);opacity:0;transition:opacity .25s;pointer-events:none;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
.banner.on{opacity:1}
.banner.bad{color:#ffd0d8;background:rgba(120,10,30,.55)}
.banner.hell{color:#ffe0a0;background:rgba(140,30,0,.6)}
.banner.ice{color:#e8fbff;background:rgba(20,80,140,.55)}
.banner.good{color:#fff;background:rgba(255,106,168,.6)}
.turn{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:clamp(24px,6vw,40px);font-weight:700;color:#ffe27a;text-shadow:0 3px 0 rgba(0,0,0,.6);opacity:0;pointer-events:none}
.turn.on{opacity:1;animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:translate(-50%,-50%) scale(1.08)}}
.screen{position:fixed;inset:0;display:grid;place-items:center;padding:16px;pointer-events:none}
.card{pointer-events:auto;width:min(420px,100%);background:rgba(255,255,255,.96);color:var(--ink);border-radius:22px;padding:22px 22px 18px;box-shadow:0 10px 0 rgba(0,0,0,.25);text-align:center}
.card h1{margin:0;font-size:clamp(38px,9vw,52px);line-height:1;letter-spacing:-.01em;color:var(--pink);text-shadow:0 3px 0 #b8336f}
.card h2{margin:0;font-size:clamp(24px,6vw,32px);line-height:1.05;color:#c8264f}
.card .tag{margin:6px 0 14px;font-size:16px;color:#5a4c78}
.go{width:100%;min-height:54px;border:0;border-radius:16px;background:var(--pink);color:#fff;font:700 22px Fredoka,sans-serif;box-shadow:0 5px 0 #b8336f;cursor:pointer}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #b8336f}
.go:focus-visible,.pbtn:focus-visible{outline:3px solid #ffe27a;outline-offset:3px}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;margin:14px 0 4px;font-size:14px;color:#3d3358;text-align:left}
.keys b{display:inline-block;min-width:4.6em;color:#1d1630}
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.score div{background:#f4eefa;border-radius:12px;padding:8px 4px}
.score b{display:block;font-size:22px;color:#1d1630;white-space:nowrap}
.score span{font-size:13px;color:#5a4c78}
.newbest{color:#ff6aa8;font-weight:700;margin:-4px 0 10px}
.small{font-size:13px;color:#6c5f88;margin-top:10px}
.hidden{display:none!important}
.err{position:fixed;left:8px;bottom:8px;right:8px;color:#fff;background:#a01830;padding:8px;border-radius:8px;font:13px system-ui;display:none}
@media(prefers-reduced-motion:reduce){.turn.on{animation:none}}
</style>
<link rel="icon" href="data:,">
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud" id="hud">
  <div class="stat">
    <div class="dist" id="dist">0 m</div>
    <div class="sub"><span class="carrot"><i></i><span id="coins">0</span></span></div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="right">
    <button class="pbtn" id="pause" aria-label="Pause">II</button>
    <div class="best stat" id="bestHud"></div>
  </div>
</div>
<div class="banner" id="banner"></div>
<div class="turn" id="turn"></div>
<div class="screen" id="start">
  <div class="card">
    <h1>Uma Run</h1>
    <p class="tag">Temple of Mambo, sprite mode with pixel-splat scenery</p>
    <button class="go" id="goBtn">Run!</button>
    <div class="keys">
      <div><b>← →</b> lanes, turns</div><div><b>Swipe</b> lanes, turns</div>
      <div><b>↑ / Space</b> jump</div><div><b>Swipe up</b> jump</div>
      <div><b>↓</b> slide</div><div><b>Swipe down</b> slide</div>
    </div>
    <p class="small" id="bestStart"></p>
  </div>
</div>
<div class="screen hidden" id="over">
  <div class="card">
    <h2 id="overTitle">Caught!</h2>
    <div class="score">
      <div><b id="oDist">0 m</b><span>distance</span></div>
      <div><b id="oCoins">0</b><span>carrots</span></div>
      <div><b id="oBest">0 m</b><span>best</span></div>
    </div>
    <p class="newbest hidden" id="newBest">New best run!</p>
    <button class="go" id="againBtn">Run again</button>
    <p class="small">Space or tap to run again</p>
  </div>
</div>
<div class="screen hidden" id="paused">
  <div class="card"><h2>Paused</h2><p class="tag">Take a breath, the monkeys are waiting.</p><button class="go" id="resumeBtn">Keep running</button></div>
</div>
<div class="err" id="err"></div>
<script>
{
// ============================================================ constants (from uma-run.html)
const S = 0.3, SQ = 0.75;                        // metres per art pixel, camera pitch squash
const LANE = 2.2, HW = 3.7, W = HW * 2, XMAX = 3.1;
const GRAV = 26, JUMPV = 9.4, SLIDE = 0.8, BASE_SPEED = 12, MAX_SPEED = 30, LAT_SPEED = 9, SPEED_RAMP = 0.0055;
const HELL_D = 5000, BIOME_MIN = 3000, BIOME_MAX = 7000, WY = -0.55, RAMP = 6, MAG_R = 9;
const PU_DUR = {magnet: 6, shield: 8, x2: 10};
const speedAt = d => Math.min(MAX_SPEED, BASE_SPEED + Math.max(0, d) * SPEED_RAMP);
const turnWin = v => Math.max(7, v * 0.42);
const segMinLen = v => Math.ceil(Math.max(32, v * 1.6 + turnWin(v) + 6));
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const $ = id => document.getElementById(id);
const SKIN = {jungle: 'jungle', hell: 'inferno', ice: 'tundra'};
const HASH = location.hash.slice(1);
const AUTO = HASH === 'autopilot' || HASH.startsWith('autopilot-');
const START_D = (m => m ? +m[1] : 0)(HASH.match(/start-(\d+)/));
addEventListener('error', e => { const d = $('err'); d.style.display = 'block'; d.textContent = 'Error: ' + e.message; });

// ============================================================ biome schedule: jungle 0-5k, Inferno 5-10k, jungle 10-12k, tundra 12k+, then shuffled
let biomeB, biomeK, biomeBag;
function biomeRoll(){ biomeB = [HELL_D, 2 * HELL_D, 2 * HELL_D + 2000]; biomeK = ['jungle', 'hell', 'jungle', 'ice']; biomeBag = []; }
function biomePick(){ if (!biomeBag.length) { biomeBag = ['jungle', 'hell', 'ice'].sort(() => Math.random() - .5); if (biomeBag[0] === biomeK[biomeK.length - 1]) biomeBag.push(biomeBag.shift()); } return biomeBag.shift(); }
function biomeExt(d){ while (biomeB[biomeB.length - 1] <= d + 1000) { biomeB.push(biomeB[biomeB.length - 1] + Math.round(rand(BIOME_MIN, BIOME_MAX))); biomeK.push(biomePick()); } }
function biomeAt(d){ biomeExt(d); let n = 0; for (const b of biomeB) if (b <= d) n++; return biomeK[n]; }
function biomeNext(d){ biomeExt(d); for (const b of biomeB) if (b > d) return b; return Infinity; }

// ============================================================ sprites: strips -> cached frames (rotate about the exact centre, squash, lift, outline once)
let SPR = {};
const cache = new Map(), STEPS = 128;
function hexRgb(c){ const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
// scenery: pixel-splat view atlases (ink-studio), one pre-rendered view every 360/directions degrees; pick the nearest view
let SPL = {};
const SPLAT_OFF = HASH.includes('stacks');          // #stacks draws the old sprite stacks, where their strips are loaded
function splatFrame(key, ang){
  const m = SPL[key], D = m.directions, d = ((Math.round(ang / (Math.PI * 2) * D) % D) + D) % D, id = key + '#' + d;
  let f = cache.get(id); if (f) return f;
  const tw = m.tileW, th = m.tileH, cw = tw + 2, ch = th + 2;
  const body = document.createElement('canvas'); body.width = cw; body.height = ch;
  const g = body.getContext('2d'); g.imageSmoothingEnabled = false;
  g.drawImage(m.img, d * tw, 0, tw, th, 1, 1, tw, th);
  const dd = g.getImageData(0, 0, cw, ch), p = dd.data, ol = m.ol, sol = new Uint8Array(cw * ch);
  for (let i = 0; i < cw * ch; i++) { if (p[i * 4 + 3] > 127) { sol[i] = 1; p[i * 4 + 3] = 255; } else p[i * 4 + 3] = 0; }
  for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) { const i = y * cw + x; if (sol[i]) continue;
    if ((x > 0 && sol[i - 1]) || (x < cw - 1 && sol[i + 1]) || (y > 0 && sol[i - cw]) || (y < ch - 1 && sol[i + cw])) { p[i * 4] = ol[0]; p[i * 4 + 1] = ol[1]; p[i * 4 + 2] = ol[2]; p[i * 4 + 3] = 255; } }
  g.putImageData(dd, 0, 0);
  const ox = Math.round(m.ax) + 1, base = Math.round(m.ay) + 1;
  // shadow: the silhouette laid down on the ground towards the lower right, as if lit from the upper left
  const sh = document.createElement('canvas'); sh.width = cw + Math.ceil(th * .45); sh.height = ch; const s = sh.getContext('2d'); s.imageSmoothingEnabled = false;
  s.setTransform(1, 0, -0.45, 0.3, ox * 0 + 1 + base * 0.45, base * 0.7 + 1); s.drawImage(body, 0, 0);
  s.setTransform(1, 0, 0, 1, 0, 0); s.globalCompositeOperation = 'source-in'; s.fillStyle = 'rgba(10,20,30,.3)'; s.fillRect(0, 0, sh.width, ch);
  f = {body, sh, ox, base}; if (cache.size > 6000) cache.clear(); cache.set(id, f); return f;
}
function frame(key, ang, stack){
  if (SPL[key] && !((SPLAT_OFF || stack) && SPR[key])) return splatFrame(key, ang);
  const k = ((Math.round(ang / (Math.PI * 2) * STEPS) % STEPS) + STEPS) % STEPS, id = key + '|' + k;
  let f = !stack && cache.get(id); if (f) return f;
  const m = SPR[key], img = m.img, w = m.sliceWidth, h = m.sliceHeight, n = m.slices, a = k / STEPS * Math.PI * 2;
  const diag = Math.ceil(Math.hypot(w, h)) + 2, cw = diag + 6, ch = Math.ceil(diag * SQ) + n + 6, ox = cw >> 1, base = ch - 3 - Math.ceil(diag * SQ / 2);
  const body = document.createElement('canvas'); body.width = cw; body.height = ch;
  const g = body.getContext('2d'); g.imageSmoothingEnabled = false;
  for (let z = 0; z < n; z++) { g.setTransform(1, 0, 0, 1, ox, base - z); g.scale(1, SQ); g.rotate(a); g.drawImage(img, z * w, 0, w, h, -w / 2, -h / 2, w, h); }
  g.setTransform(1, 0, 0, 1, 0, 0);
  const d = g.getImageData(0, 0, cw, ch), p = d.data, ol = m.ol, sol = new Uint8Array(cw * ch);
  for (let i = 0; i < cw * ch; i++) { if (p[i * 4 + 3] > 127) { sol[i] = 1; p[i * 4 + 3] = 255; } else p[i * 4 + 3] = 0; }
  for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) { const i = y * cw + x; if (sol[i]) continue;
    if ((x > 0 && sol[i - 1]) || (x < cw - 1 && sol[i + 1]) || (y > 0 && sol[i - cw]) || (y < ch - 1 && sol[i + cw])) { p[i * 4] = ol[0]; p[i * 4 + 1] = ol[1]; p[i * 4 + 2] = ol[2]; p[i * 4 + 3] = 255; } }
  g.putImageData(d, 0, 0);
  const sh = document.createElement('canvas'); sh.width = cw; sh.height = ch; const s = sh.getContext('2d'); s.imageSmoothingEnabled = false;
  for (let z = 0; z < Math.min(n, 3); z++) { s.setTransform(1, 0, 0, 1, ox + 2, base + 2); s.scale(1, SQ); s.rotate(a); s.drawImage(img, z * w, 0, w, h, -w / 2, -h / 2, w, h); }
  s.setTransform(1, 0, 0, 1, 0, 0); s.globalCompositeOperation = 'source-in'; s.fillStyle = 'rgba(10,20,30,.3)'; s.fillRect(0, 0, cw, ch);
  f = {body, sh, ox, base}; if (cache.size > 6000) cache.clear(); cache.set(id, f); return f;
}
// pickup icons (the game draws these as billboards too)
function icon(type){
  const c = document.createElement('canvas'); c.width = c.height = 11; const g = c.getContext('2d');
  const px = (x, y, col) => { g.fillStyle = col; g.fillRect(x, y, 1, 1); };
  const ring = (col) => { for (let y = 0; y < 11; y++) for (let x = 0; x < 11; x++) { const r = Math.hypot(x - 5, y - 5); if (r < 5.4) px(x, y, r > 4.4 ? '#ffffff' : col); } };
  if (type === 'magnet') { ring('#ff4d6a'); for (const [x, y] of [[3,3],[3,4],[3,5],[3,6],[4,7],[5,7],[6,7],[7,6],[7,5],[7,4],[7,3]]) px(x, y, '#fff'); px(3, 3, '#cfd6e0'); px(7, 3, '#cfd6e0'); }
  else if (type === 'shield') { ring('#2fb8ff'); for (const [x, y] of [[3,3],[4,3],[5,3],[6,3],[7,3],[3,4],[7,4],[3,5],[7,5],[4,6],[6,6],[5,7]]) px(x, y, '#fff'); }
  else { ring('#ff8a1e'); for (const [x, y] of [[2,4],[4,4],[3,5],[2,6],[4,6],[6,4],[7,4],[8,4],[8,5],[7,5],[6,6],[6,7],[7,7],[8,7]]) px(x, y, '#fff'); }
  return c;
}
const ICON = {magnet: icon('magnet'), shield: icon('shield'), x2: icon('x2')};

// ============================================================ track
const DIRS = {'0': [0, -1], '1': [1, 0], '-1': [-1, 0]};
let segments = [], segHist = [], riverNextD = 620, P, cam, state = 'start', time = 0;
function pickSegLen(d0, noShort){
  const v = speedAt(d0 + 60), minL = segMinLen(v), kinds = {short: .3, med: .42, long: .28};
  const range = {short: [minL, minL + 18], med: [Math.max(minL + 24, 78), 140], long: [220, 420]};
  const a = segHist[segHist.length - 2], b = segHist[segHist.length - 1], ban = new Set();
  if (a && b && a.k === b.k) ban.add(a.k); if (noShort) ban.add('short');
  const ks = Object.keys(kinds).filter(x => !ban.has(x)), tot = ks.reduce((t, x) => t + kinds[x], 0);
  let r = Math.random() * tot, k = ks[ks.length - 1]; for (const x of ks) if ((r -= kinds[x]) < 0) { k = x; break; }
  let L = Math.round(rand(...range[k]));
  const rem = biomeNext(d0 + .5) - d0;
  if (rem >= minL && (L >= rem || rem - L < segMinLen(speedAt(d0 + rem + 60)))) L = rem;
  return {k, L, minL};
}
function makeSegment(prev){
  const g = {props: [], obstacles: [], coins: [], pickups: [], gaps: []};
  if (!prev) { g.sx = 0; g.sz = 0; g.h = 0; g.L = 120; g.d0 = START_D - 6; g.first = true; g.kind = 'med'; g.a0 = -25; }
  else { g.sx = prev.sx + prev.dx * prev.L; g.sz = prev.sz + prev.dz * prev.L; g.h = prev.h + prev.turn; g.d0 = prev.d0 + prev.L; g.a0 = -HW;
    const pk = pickSegLen(g.d0, prev.first); g.L = pk.L; g.kind = pk.k; g.minL = pk.minL; }
  g.biome = biomeAt(g.d0 + .5);
  g.gate = prev ? g.biome !== prev.biome : g.biome !== 'jungle';
  const nb = biomeNext(g.d0 + .5); if (g.d0 + g.L > nb && nb - g.d0 >= (g.minL || 40)) g.L = nb - g.d0;
  if (prev && g.biome === 'jungle' && !prev.first && g.d0 + 30 >= riverNextD && biomeNext(g.d0 + .5) > g.d0 + g.L + 1) {   // a river on this straight
    const rLen = Math.round(78 + Math.min(72, g.d0 * .012) + rand(-8, 8)), r0 = 32, r1 = r0 + rLen;
    const v = speedAt(g.d0 + r1 + 40), gr = Math.max(20, Math.ceil(speedAt(g.d0 + r1) * 2.5));
    g.L = Math.max(g.L, Math.ceil(r1 + RAMP + gr + 16), Math.ceil(r1 + RAMP + 14 + turnWin(v) + v * .9));
    g.river = {r0, r1, rA: r0 - RAMP, rB: r1 + RAMP, g: gr};
    riverNextD = g.d0 + g.river.rB + Math.max(480, 1050 - g.d0 * .06) * rand(.85, 1.15);
  }
  segHist.push({k: g.kind, L: g.L}); if (segHist.length > 4) segHist.shift();
  g.turn = g.h === 0 ? (Math.random() < .5 ? -1 : 1) : -g.h;
  [g.dx, g.dz] = DIRS[g.h]; g.rx = -g.dz; g.rz = g.dx; g.th = g.h * Math.PI / 2;
  g.ter = g.biome === 'jungle' ? HW + 9.7 : HW + 2.9;
  buildObstacles(g); buildCoins(g); buildProps(g, prev);
  g.props = g.props.filter(p => !p.drop);
  // v42-style corridor clearance: no decoration may stand in (or loom over) a neighbouring straight's run corridor
  for (const o of [prev, prev && prev.prevSeg].filter(Boolean)) { clearCorridor(o, g); clearCorridor(g, o); }
  g.prevSeg = prev || null;
  return g;
}
function buildObstacles(g){
  const L = g.L, RV = g.river, spd = Math.max(P ? P.speed : BASE_SPEED, BASE_SPEED);
  let s = g.first ? 42 : 24;
  while (s < L - 16) {
    if (RV && s > RV.rA - 9 && s < RV.rB + RV.g) { s = RV.rB + RV.g; continue; }
    const r = Math.random(); let o;
    if (r < .17) { const len = rand(3, 4.2); o = {type: 'gap', s0: s, s1: s + len}; g.gaps.push([s, s + len]); }
    else if (r < .37) o = {type: 'root', s0: s - .35, s1: s + .35};
    else if (r < .57) o = {type: 'arch', s0: s - .4, s1: s + .4};
    else if (r < .67) o = {type: 'barrier', s0: s - .4, s1: s + .4};
    else { const n = Math.random() < .55 ? 1 : 2; o = {type: 'wall', s0: s - .5, s1: s + .5, lanes: [-1, 0, 1].sort(() => Math.random() - .5).slice(0, n)}; }
    o.s = s; g.obstacles.push(o); s = o.s1 + rand(13, 22) + spd * .4;
  }
  if (RV) {                                                         // rocks in the river: tall ones to dodge, low wide ones to hop
    const hard = clamp(g.d0 / 6000, 0, 1);
    for (let s2 = RV.r0 + 14; s2 < RV.r1 - 8; s2 += rand(14, 20) - hard * 3) {
      const o = {type: 'rock', s: s2, s0: s2 - .5, s1: s2 + .5, rocks: []};
      if (Math.random() < .35) { const c = Math.random() < .5 ? -1 : 1; o.rocks.push({x: c * LANE / 2, hw: 2.4, h: .55, low: true}); }
      else for (const l of [-1, 0, 1].sort(() => Math.random() - .5).slice(0, Math.random() < .5 + hard * .3 ? 2 : 1)) o.rocks.push({x: l * LANE, hw: .95, h: 1.25});
      g.obstacles.push(o);
    }
    g.obstacles.sort((a, b) => a.s - b.s);
  }
}
function buildCoins(g){
  const RV = g.river, GAP = 2.6, add = (s, x, y) => g.coins.push({s, x, y, taken: false});

// ============================================================ particles (world space, 1 px dots)
const parts = [];

// ============================================================ rendering
const cv = $('cv'), ctx = cv.getContext('2d'), buf = document.createElement('canvas'), bg = buf.getContext('2d');

addEventListener('resize', resize);
const RGB = (r, g, b) => (0xff000000 | (b << 16) | (g << 8) | r) >>> 0;

  jGrass: [RGB(114, 200, 69), RGB(96, 182, 58), RGB(138, 216, 82)], jLow: [RGB(52, 128, 50), RGB(44, 112, 44), RGB(62, 142, 56)], jEdge: RGB(30, 78, 34), jHole: RGB(18, 36, 26),
  jFlower: [RGB(255, 127, 184), RGB(255, 225, 74), RGB(255, 255, 255), RGB(181, 139, 255)],
  hStone: RGB(104, 78, 74), hGrout: RGB(46, 30, 28), hGlow: RGB(255, 118, 30), hLedge: RGB(76, 56, 53), hLava: [RGB(50, 23, 18), RGB(118, 26, 10), RGB(220, 80, 20), RGB(255, 178, 66)],
  iTile: RGB(226, 240, 255), iGrout: RGB(160, 224, 250), iLedge: [RGB(244, 248, 255), RGB(226, 236, 250)], iSea: [RGB(212, 233, 250), RGB(192, 222, 244), RGB(236, 246, 255)], iHole: RGB(14, 40, 60),

function render(){

// ============================================================ HUD

// ============================================================ input

  else if (k === 'ArrowRight' || k === 'd' || k === 'D') side(1);
  else if (k === 'ArrowUp' || k === 'w' || k === 'W' || k === ' ') { e.preventDefault(); if (state === 'paused') return resume(); jump(); }

addEventListener('blur', () => { if (!AUTO) pause(); });
